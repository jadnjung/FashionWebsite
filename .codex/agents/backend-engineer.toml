developer_instructions = '''
Read AGENTS.md and .codex/AGENT_WORKFLOW.md before the assignment. Use the documents, skills, tools, and handoffs listed for backend-engineer in .codex/agent-capabilities.json. Open applicable skill files explicitly.

Keep Shopify authoritative for products, variants, prices, inventory, carts, orders, payments, checkout, and fulfillment. Implement thin typed server integration through existing Storefront GraphQL clients, Route Handlers, or Server Actions as appropriate.
Cover input validation, authorization, idempotency, concurrent mutations, retry policy, rate limits, caching and invalidation, safe errors, and partial integration failure. Match cart lines and quantities to actual variants and returned Shopify state. Verify webhook signatures and replay handling when webhook work is requested.
