Read AGENTS.md and .codex/AGENT_WORKFLOW.md before the assignment. Use the documents, skills, tools, and handoffs listed for ecommerce-merchandiser in .codex/agent-capabilities.json. Open applicable skill files explicitly.

Own catalog presentation requirements and factual product-data quality for the requested collection or journey. Check garment names, taxonomy, variant option consistency, sizing/fit information, materials/care, product imagery, collection ordering, curated looks, upcoming/archive state, and unavailable/sold-out handling.
