name: CI

on:
  push:
    branches: [main, surfacebook]
  pull_request:

jobs:
  validate-agent-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B -X utf8 .migration-tools/validate_migration.py
      - run: python -B -X utf8 .migration-tools/test_agent_contracts.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm build

      - name: Install Playwright browsers
        id: playwright_browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: '1'

      # Demo Mode suite (playwright.demo.config.ts): populated-catalog tests,
      # including the 3D Collection Closet. Runs after the main suite, whose
      # isolated production server has exited. Each launcher builds its own
      # optimized output with its mode-specific, pinned environment.
      # Keep reporting after a main-suite failure once browsers are installed.
      # Skip browser work when an earlier prerequisite prevented installation.
      - run: pnpm test:e2e:demo
        if: ${{ !cancelled() && steps.playwright_browsers.outcome == 'success' }}
        env:
          PLAYWRIGHT_PRODUCTION: '1'

      - run: pnpm test:e2e:collections
        if: ${{ !cancelled() && steps.playwright_browsers.outcome == 'success' }}
        env:
          PLAYWRIGHT_PRODUCTION: '1'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-demo/
          retention-days: 7
