name: CI

on:
  push:
    branches: [main, surfacebook]
  pull_request:

jobs:
  validate-agent-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B -X utf8 .migration-tools/validate_migration.py
      - run: python -B -X utf8 .migration-tools/test_agent_contracts.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm test:e2e

      # Demo Mode suite (playwright.demo.config.ts): populated-catalog tests,
      # including the 3D Collection Closet. Runs after the main suite, whose
      # dev server has exited — Next 16 allows one `next dev` per directory.
      # `!cancelled()` so a main-suite failure still reports this suite too.
      - run: pnpm test:e2e:demo
        if: ${{ !cancelled() }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-demo/
          retention-days: 7
